name: Build BTHomeV2 Logger

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.5"

      - name: Compile and build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BTHomeV2-Logger.apk

      - name: Upload BTHomeV2 Logger APK
        uses: actions/upload-artifact@v6
        with:
          name: BTHomeV2 Logger
          path: BTHomeV2-Logger.apk
          if-no-files-found: error
